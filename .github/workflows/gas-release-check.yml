name: GAS-only release checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps-script/**'
      - 'tests/gas-*.cjs'
      - 'tests/intake-audit-integrity.cjs'
      - 'tests/line-reminder-safety.cjs'
      - '.github/workflows/gas-release-check.yml'
  push:
    paths:
      - 'apps-script/**'
      - 'tests/gas-*.cjs'
      - 'tests/intake-audit-integrity.cjs'
      - 'tests/line-reminder-safety.cjs'
      - '.github/workflows/gas-release-check.yml'
jobs:
  gas-offline-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Medicine schedule, shelf and role tests
        run: node tests/gas-logic.test.cjs
      - name: Authorization, fail-closed LINE and image retention tests
        run: node tests/gas-permissions.test.cjs
      - name: Admin-only ephemeral real-device demonstration tests
        run: node tests/gas-demo.test.cjs
      - name: S3 verified schedule apply, reboot and empty-schedule tests
        run: node tests/gas-schedule-ack.test.cjs
      - name: Q8H first-confirmation arithmetic (not activated in production)
        run: node tests/gas-q8h-logic.test.cjs
      - name: ADMIN read-only software go-live checklist and authorization
        run: node tests/gas-system-readiness.test.cjs
      - name: Device intake idempotency and audit integrity
        run: node tests/intake-audit-integrity.cjs
      - name: LINE reminder trigger jitter and duplicate safety
        run: node tests/line-reminder-safety.cjs
