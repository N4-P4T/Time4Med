name: Verify Time4Med main entry
on:
  pull_request:
    paths:
      - 'index.html'
      - 'modern-preview/**'
      - 'tests/main-entry.test.cjs'
      - '.github/workflows/main-entry-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/main-entry.test.cjs
