name: Verify Time4Med opt-in LINE automatic reminder engine

on:
  pull_request:
    paths:
      - 'integrations/line-apps-script/AutoReminder.gs'
      - 'tests/line-gas-auto-reminder.test.cjs'
      - '.github/workflows/line-gas-auto-reminder-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Apps Script source syntax
        run: |
          node --check < integrations/line-apps-script/AutoReminder.gs
          node --check tests/line-gas-auto-reminder.test.cjs
      - name: Run offline automatic reminder tests (no actual LINE messages)
        run: node --test tests/line-gas-auto-reminder.test.cjs
