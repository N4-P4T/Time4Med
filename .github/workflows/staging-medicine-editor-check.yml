name: Staging Medicine Editor — Sheets API create and edit

on:
  pull_request:
    paths:
      - 'staging-google-login/**'
      - 'tests/staging-medicine-editor.test.mjs'
      - '.github/workflows/staging-medicine-editor-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  medicine-editor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate editor and existing read-only preview
        run: |
          node --check staging-google-login/medicine-editor.js
          node tests/staging-medicine-editor.test.mjs
          node tests/staging-schedule-preview.test.mjs
          node tests/staging-google-login.test.mjs
