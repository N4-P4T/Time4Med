name: Time4Med GitHub Pages GAS bridge browser check
on:
  pull_request:
    paths:
      - 'test-v021/gas-only.js'
      - 'test-v021/gas-only.css'
      - 'test-v021/index.html'
      - 'apps-script/Bridge.html'
      - 'apps-script/Code.gs'
      - 'tests/gas-pages-integration.test.cjs'
      - '.github/workflows/gas-pages-bridge.yml'
  workflow_dispatch:
jobs:
  bridge-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright without changing project dependencies
        run: npm install --no-save playwright@1.56.1
      - name: Install Chromium on supported Ubuntu
        run: npx playwright install --with-deps chromium
      - name: Probe public Apps Script Bridge deployment (no personal data or credentials)
        shell: bash
        run: |
          set +e
          URL='https://script.google.com/macros/s/AKfycbx2-O9PDp-T0eXoP1A9_xesHk8mWcWszAbLsbsFOMpARpIIICibdKu6On0G0agGdMIEtQ/exec?bridge=1&channel=abcdef0123456789abcdef0123456789'
          CODE=$(curl --max-time 22 -sSL -o /tmp/t4m-bridge-probe.html -w '%{http_code}' "$URL")
          echo "HTTP status: $CODE"
          echo "Contains Bridge greeting: $(grep -ic 'Time4Med secure bridge' /tmp/t4m-bridge-probe.html || true)"
          echo "Contains Invalid channel: $(grep -ic 'Invalid bridge channel' /tmp/t4m-bridge-probe.html || true)"
          echo "Contains login page: $(grep -ic 'accounts.google.com\\|signin\\|ServiceLogin' /tmp/t4m-bridge-probe.html || true)"
          echo "Contains server exception: $(grep -ic 'Exception\\|Script function not found\\|Error' /tmp/t4m-bridge-probe.html || true)"
          echo "Bridge RPC marker count: $(grep -oic 'time4med-gas-bridge' /tmp/t4m-bridge-probe.html || true)"
          echo "Legacy Apps Script UI marker count: $(grep -oic 't4m-otp\\|sendOtp\\|medication adherence\\|ระบบดูแลการใช้ยา' /tmp/t4m-bridge-probe.html || true)"
          echo "Response title excerpts:"
          grep -Eo '<title>[^<]{0,120}' /tmp/t4m-bridge-probe.html | head -n 3 || true
          echo "Header content-type:"
          file -b --mime-type /tmp/t4m-bridge-probe.html
          echo "Bytes: $(wc -c < /tmp/t4m-bridge-probe.html)"
          exit 0
      - name: Test GitHub Pages OTP, dashboard and GAS iframe bridge (mock API)
        run: node tests/gas-pages-integration.test.cjs
