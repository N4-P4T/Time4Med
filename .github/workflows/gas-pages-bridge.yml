name: Time4Med legacy Pages and Apps Script bridge check
on:
  pull_request:
    paths:
      - 'test-v021/gas-only.js'
      - 'test-v021/gas-only.css'
      - 'test-v021/index.html'
      - 'apps-script/Bridge.html'
      - 'apps-script/Code.gs'
      - 'tests/gas-pages-integration.test.cjs'
      - 'tests/gas-multilogin-fallback.test.cjs'
      - 'tests/gas-direct-fallback.test.cjs'
      - '.github/workflows/gas-pages-bridge.yml'
  workflow_dispatch:
jobs:
  bridge-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright without changing project dependencies
        run: npm install --no-save playwright@1.56.1
      - name: Install Chromium on supported Ubuntu
        run: npx playwright install --with-deps chromium
      - name: Test GitHub Pages OTP, dashboard and GAS iframe bridge (mock API)
        run: node tests/gas-pages-integration.test.cjs
      - name: Simulate multiple Google accounts and 404 route recovery
        run: node tests/gas-multilogin-fallback.test.cjs
      - name: Offer direct GAS HTML app when all account routes fail
        run: node tests/gas-direct-fallback.test.cjs
