<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="refresh" content="0;url=./test-v020/">
  <title>Time4Med — เข้าสู่ระบบผู้ดูแล</title>
  <style>
    :root {font-family:system-ui,"Noto Sans Thai",sans-serif;background:#f2f6fc;color:#183b60}
    body {min-height:100vh;display:grid;place-items:center;margin:0;padding:24px}
    main {width:min(100%,460px);padding:32px;border-radius:18px;
      background:#fff;box-shadow:0 10px 35px rgba(25,57,95,.1);text-align:center}
    h1 {font-size:1.55rem;margin:.4rem 0}
    p {color:#50657d;line-height:1.7}
    a {display:inline-block;background:#135e9f;color:#fff;padding:11px 18px;
      text-decoration:none;border-radius:10px;font-weight:700}
    a:focus-visible {outline:3px solid #e8a334;outline-offset:3px}
  </style>
  <script>
    (function () {
      var allowed = /^(#dashboard|#devices|#medication|#inventory|#analytics|#activity|#camera|#gallery)$/;
      var section = allowed.test(window.location.hash) ? window.location.hash : '';
      window.location.replace('./test-v020/' + section);
    }());
  </script>
</head>
<body>
  <main>
    <h1>Time4Med</h1>
    <p>กำลังเปิดระบบผู้ดูแลเวอร์ชันใหม่ พร้อม Google Sign-In และแดชบอร์ดภาพรวม</p>
    <p>หากไม่เปลี่ยนหน้าอัตโนมัติ ให้กดปุ่มด้านล่าง</p>
    <a href="./test-v020/">เข้าสู่ระบบ Time4Med</a>
  </main>
</body>
</html>
