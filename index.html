<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Time4Med | เข้าสู่ระบบ</title>
<style>
body{margin:0;font-family:system-ui,"Noto Sans Thai",sans-serif;min-height:100vh;display:grid;place-items:center;background:#eef5fb;color:#163954}
main{width:min(90%,520px);background:white;border:1px solid #d6e4ef;box-shadow:0 15px 40px #1b48711a;border-radius:22px;padding:38px;text-align:center}
h1{font-size:2rem}p{line-height:1.8;color:#547087}.logo{font-size:44px;color:#1870b6}
a{display:inline-block;background:#1769b1;color:white;text-decoration:none;border-radius:12px;padding:13px 20px;font-weight:700}
.note{font-size:13px;margin-top:20px}
</style></head><body>
<main><div class="logo">✚</div><h1>Time4Med</h1>
<p>ตู้ยาอัจฉริยะ · ระบบติดตามและแจ้งเตือนการรับประทานยา</p><p>สำหรับแอดมินและผู้ดูแลผู้สูงอายุ</p>
<a id="enter" href="#">เข้าสู่ระบบ</a><p class="note" id="status">ใช้ Google Apps Script + Google Sheets + LINE</p></main>
<script>
const APP_URL='https://script.google.com/macros/s/AKfycbx2-O9PDp-T0eXoP1A9_xesHk8mWcWszAbLsbsFOMpARpIIICibdKu6On0G0agGdMIEtQ/exec';
const ready=/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(APP_URL);
const enter=document.getElementById('enter');
if(ready){enter.href=APP_URL;document.getElementById('status').textContent='เปิดหน้าลงชื่อเข้าใช้ผ่าน Google Apps Script';}
else{enter.removeAttribute('href');enter.setAttribute('aria-disabled','true');enter.style.opacity='.55';
document.getElementById('status').textContent='ยังไม่ได้ตั้งค่า URL เว็บแอป Google Apps Script กรุณาติดตั้งก่อนเปิดใช้';}
</script></body></html>
